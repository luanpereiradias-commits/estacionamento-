<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 16px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }

        .header .status {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
        }

        .status-item span {
            font-weight: 700;
            color: #f1f5f9;
        }

        /* Layout principal */
        .main {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        @media (max-width: 1000px) {
            .main { grid-template-columns: 1fr; }
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 20px;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grade de vagas */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
            gap: 10px;
        }

        .vaga {
            height: 72px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .vaga.livre {
            background: #064e3b;
            color: #34d399;
            border-color: #059669;
        }

        .vaga.ocupada {
            background: #7f1d1d;
            color: #fca5a5;
            border-color: #dc2626;
        }

        .vaga:hover {
            transform: scale(1.05);
        }

        .vaga.selecionada {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.4);
        }

        .vaga .placa {
            font-size: 0.68rem;
            margin-top: 3px;
            opacity: 0.9;
        }

        /* Painel de operação */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            transition: 0.2s;
        }

        .tab.ativo {
            background: #0369a1;
            color: white;
            border-color: #0ea5e9;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: white;
            margin-top: 6px;
            transition: 0.2s;
        }

        .btn-entrada {
            background: #059669;
        }
        .btn-entrada:hover { background: #047857; }

        .btn-saida {
            background: #dc2626;
        }
        .btn-saida:hover { background: #b91c1c; }

        .btn-saida:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        /* Ticket */
        .ticket {
            background: #0f172a;
            border: 2px dashed #475569;
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .ticket.mostrar {
            display: block;
            animation: fadeIn 0.3s;
        }

        .ticket h3 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .ticket .linha {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 0.95rem;
        }

        .ticket .valor {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fbbf24;
            margin-top: 10px;
        }

        /* Mensagem */
        .mensagem {
            margin-top: 14px;
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
            min-height: 48px;
        }

        /* Histórico */
        .historico {
            margin-top: 18px;
            max-height: 220px;
            overflow-y: auto;
        }

        .log {
            background: #0f172a;
            padding: 9px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.82rem;
            border-left: 3px solid #38bdf8;
        }

        .log.entrada { border-left-color: #34d399; }
        .log.saida { border-left-color: #f87171; }

        .log .hora {
            color: #64748b;
            font-size: 0.75rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        .historico::-webkit-scrollbar { width: 5px; }
        .historico::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>🅿️ Sistema de Estacionamento</h1>
            <div class="status">
                <div class="status-item">Vagas: <span id="total">30</span></div>
                <div class="status-item">Livres: <span id="livres" style="color:#34d399">30</span></div>
                <div class="status-item">Ocupadas: <span id="ocupadas" style="color:#f87171">0</span></div>
                <div class="status-item">Ocupação: <span id="ocupacao">0%</span></div>
            </div>
        </div>

        <div class="main">
            <!-- Mapa de Vagas -->
            <div class="card">
                <h2>🗺️ Mapa de Vagas</h2>
                <div class="grid" id="grid"></div>
            </div>

            <!-- Painel do Operador -->
            <div class="card">
                <h2>👨‍💻 Painel do Operador</h2>

                <div class="tabs">
                    <div class="tab ativo" id="tabEntrada" onclick="mudarAba('entrada')">ENTRADA</div>
                    <div class="tab" id="tabSaida" onclick="mudarAba('saida')">SAÍDA</div>
                </div>

                <!-- Formulário Entrada -->
                <div id="formEntrada">
                    <div class="form-group">
                        <label>Placa do Veículo</label>
                        <input type="text" id="placaEntrada" placeholder="ABC1D23" maxlength="8">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Veículo</label>
                        <select id="tipo">
                            <option value="carro">🚗 Carro - R$ 8,00/h</option>
                            <option value="moto">🏍️ Moto - R$ 5,00/h</option>
                            <option value="suv">🚙 SUV / Van - R$ 12,00/h</option>
                        </select>
                    </div>
                    <button class="btn-entrada" onclick="registrarEntrada()">Registrar Entrada</button>
                </div>

                <!-- Formulário Saída -->
                <div id="formSaida" style="display:none">
                    <div class="form-group">
                        <label>Placa do Veículo</label>
                        <input type="text" id="placaSaida" placeholder="ABC1D23" maxlength="8">
                    </div>
                    <button class="btn-saida" onclick="registrarSaida()">Registrar Saída e Cobrar</button>
                </div>

                <!-- Ticket -->
                <div class="ticket" id="ticket">
                    <h3>🎫 TICKET DE ESTACIONAMENTO</h3>
                    <div class="linha"><span>Placa:</span> <strong id="t-placa">-</strong></div>
                    <div class="linha"><span>Vaga:</span> <strong id="t-vaga">-</strong></div>
                    <div class="linha"><span>Tipo:</span> <strong id="t-tipo">-</strong></div>
                    <div class="linha"><span>Entrada:</span> <strong id="t-entrada">-</strong></div>
                    <div class="linha"><span>Saída:</span> <strong id="t-saida">-</strong></div>
                    <div class="linha"><span>Tempo:</span> <strong id="t-tempo">-</strong></div>
                    <div class="valor" id="t-valor">R$ 0,00</div>
                </div>

                <div class="mensagem" id="mensagem">
                    Aguardando operação...
                </div>

                <div class="historico">
                    <h3 style="font-size:0.9rem; color:#94a3b8; margin-bottom:10px;">📋 Últimas Operações</h3>
                    <div id="logs"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOTAL = 30;
        const PRECOS = {
            carro: 8,
            moto: 5,
            suv: 12
        };

        let vagas = [];
        let historico = [];
        let modo = 'entrada'; // entrada ou saida

        // Carrega dados
        function carregar() {
            const dados = localStorage.getItem('estacionamento_real');
            if (dados) {
                const p = JSON.parse(dados);
                vagas = p.vagas || [];
                historico = p.historico || [];
            }
            if (vagas.length === 0) {
                for (let i = 1; i <= TOTAL; i++) {
                    vagas.push({
                        numero: i,
                        ocupada: false,
                        placa: null,
                        tipo: null,
                        entrada: null
                    });
                }
            }
        }

        function salvar() {
            localStorage.setItem('estacionamento_real', JSON.stringify({ vagas, historico }));
        }

        function desenhar() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            vagas.forEach(v => {
                const div = document.createElement('div');
                div.className = `vaga ${v.ocupada ? 'ocupada' : 'livre'}`;
                div.innerHTML = `
                    V${String(v.numero).padStart(2,'0')}
                    ${v.ocupada ? `<div class="placa">${v.placa}</div>` : ''}
                `;
                div.onclick = () => {
                    if (v.ocupada) {
                        document.getElementById('placaSaida').value = v.placa;
                        mudarAba('saida');
                        document.getElementById('mensagem').innerHTML = `Vaga V${String(v.numero).padStart(2,'0')} selecionada (${v.placa})`;
                    } else {
                        mudarAba('entrada');
                        document.getElementById('mensagem').innerHTML = `Vaga V${String(v.numero).padStart(2,'0')} livre`;
                    }
                };
                grid.appendChild(div);
            });

            atualizarStatus();
            renderHistorico();
        }

        function atualizarStatus() {
            const ocupadas = vagas.filter(v => v.ocupada).length;
            document.getElementById('livres').textContent = TOTAL - ocupadas;
            document.getElementById('ocupadas').textContent = ocupadas;
            document.getElementById('ocupacao').textContent = Math.round((ocupadas / TOTAL) * 100) + '%';
        }

        function mudarAba(tipo) {
            modo = tipo;
            document.getElementById('tabEntrada').classList.toggle('ativo', tipo === 'entrada');
            document.getElementById('tabSaida').classList.toggle('ativo', tipo === 'saida');
            document.getElementById('formEntrada').style.display = tipo === 'entrada' ? 'block' : 'none';
            document.getElementById('formSaida').style.display = tipo === 'saida' ? 'block' : 'none';
            document.getElementById('ticket').classList.remove('mostrar');
        }

        // ===== ENTRADA =====
        function registrarEntrada() {
            let placa = document.getElementById('placaEntrada').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            const tipo = document.getElementById('tipo').value;

            if (placa.length < 7) {
                alert('Digite uma placa válida!');
                return;
            }

            // Já está dentro?
            if (vagas.some(v => v.ocupada && v.placa === placa)) {
                alert('Este veículo já está estacionado!');
                return;
            }

            const vagaLivre = vagas.find(v => !v.ocupada);
            if (!vagaLivre) {
                alert('Estacionamento lotado!');
                return;
            }

            vagaLivre.ocupada = true;
            vagaLivre.placa = placa;
            vagaLivre.tipo = tipo;
            vagaLivre.entrada = new Date().toISOString();

            document.getElementById('placaEntrada').value = '';
            adicionarLog('entrada', `ENTRADA → ${placa} | Vaga V${String(vagaLivre.numero).padStart(2,'0')} | ${tipo}`);
            document.getElementById('mensagem').innerHTML = `
                ✅ Entrada registrada<br>
                Placa: <strong>${placa}</strong> | Vaga: <strong>V${String(vagaLivre.numero).padStart(2,'0')}</strong>
            `;

            // Mostra ticket de entrada
            mostrarTicketEntrada(vagaLivre);

            salvar();
            desenhar();
        }

        // ===== SAÍDA =====
        function registrarSaida() {
            let placa = document.getElementById('placaSaida').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

            if (placa.length < 7) {
                alert('Digite a placa!');
                return;
            }

            const vaga = vagas.find(v => v.ocupada && v.placa === placa);
            if (!vaga) {
                alert('Veículo não encontrado no estacionamento!');
                return;
            }

            const tempo = calcularTempo(vaga.entrada);
            const valor = calcularValor(vaga.entrada, vaga.tipo);
            const saida = new Date();

            // Mostra ticket de saída
            mostrarTicketSaida(vaga, saida, tempo, valor);

            adicionarLog('saida', `SAÍDA → ${placa} | Vaga V${String(vaga.numero).padStart(2,'0')} | ${tempo} | R$ ${valor.toFixed(2)}`);

            // Libera a vaga
            vaga.ocupada = false;
            vaga.placa = null;
            vaga.tipo = null;
            vaga.entrada = null;

            document.getElementById('placaSaida').value = '';
            document.getElementById('mensagem').innerHTML = `
                ✅ Saída registrada<br>
                Valor a cobrar: <strong style="color:#fbbf24">R$ ${valor.toFixed(2)}</strong>
            `;

            salvar();
            desenhar();
        }

        function calcularTempo(entradaISO) {
            const diff = Math.floor((new Date() - new Date(entradaISO)) / 1000);
            if (diff < 60) return `${diff}s`;
            if (diff < 3600) return `${Math.floor(diff/60)}min`;
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            return `${h}h ${m}min`;
        }

        function calcularValor(entradaISO, tipo) {
            const horas = (new Date() - new Date(entradaISO)) / (1000 * 60 * 60);
            const precoHora = PRECOS[tipo] || 8;
            // Mínimo 1 hora
            return Math.max(1, Math.ceil(horas)) * precoHora;
        }

        function mostrarTicketEntrada(vaga) {
            const t = document.getElementById('ticket');
            t.classList.add('mostrar');
            document.getElementById('t-placa').textContent = vaga.placa;
            document.getElementById('t-vaga').textContent = 'V' + String(vaga.numero).padStart(2,'0');
            document.getElementById('t-tipo').textContent = vaga.tipo.toUpperCase();
            document.getElementById('t-entrada').textContent = new Date(vaga.entrada).toLocaleString('pt-BR');
            document.getElementById('t-saida').textContent = '-';
            document.getElementById('t-tempo').textContent = '-';
            document.getElementById('t-valor').textContent = 'ENTRADA REGISTRADA';
        }

        function mostrarTicketSaida(vaga, saida, tempo, valor) {
            const t = document.getElementById('ticket');
            t.classList.add('mostrar');
            document.getElementById('t-placa').textContent = vaga.placa;
            document.getElementById('t-vaga').textContent = 'V' + String(vaga.numero).padStart(2,'0');
            document.getElementById('t-tipo').textContent = vaga.tipo.toUpperCase();
            document.getElementById('t-entrada').textContent = new Date(vaga.entrada).toLocaleString('pt-BR');
            document.getElementById('t-saida').textContent = saida.toLocaleString('pt-BR');
            document.getElementById('t-tempo').textContent = tempo;
            document.getElementById('t-valor').textContent = 'R$ ' + valor.toFixed(2);
        }

        function adicionarLog(tipo, texto) {
            historico.unshift({
                tipo,
                texto,
                hora: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
            });
            if (historico.length > 15) historico.pop();
        }

        function renderHistorico() {
            const el = document.getElementById('logs');
            el.innerHTML = '';
            if (historico.length === 0) {
                el.innerHTML = '<div style="color:#64748b;font-size:0.85rem">Nenhuma operação ainda</div>';
                return;
            }
            historico.forEach(item => {
                const div = document.createElement('div');
                div.className = `log ${item.tipo}`;
                div.innerHTML = `<div class="hora">${item.hora}</div>${item.texto}`;
                el.appendChild(div);
            });
        }

        // Inicia
        carregar();
        desenhar();
    </script>
</body>
</html>

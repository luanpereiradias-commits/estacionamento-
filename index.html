<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamento Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            color: #e2e8f0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stat-card .number {
            font-size: 2.4rem;
            font-weight: 700;
        }

        .stat-card.total .number { color: #60a5fa; }
        .stat-card.livre .number { color: #34d399; }
        .stat-card.ocupada .number { color: #f87171; }
        .stat-card.receita .number { color: #fbbf24; }

        /* Layout principal */
        .main {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
        }

        @media (max-width: 950px) {
            .main {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(12px);
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grade de vagas */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 12px;
        }

        .vaga {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid transparent;
            position: relative;
            font-size: 0.95rem;
        }

        .vaga.livre {
            background: rgba(52, 211, 153, 0.15);
            border-color: #34d399;
            color: #34d399;
        }

        .vaga.ocupada {
            background: rgba(248, 113, 113, 0.15);
            border-color: #f87171;
            color: #f87171;
        }

        .vaga:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .vaga.selecionada {
            border-color: #fbbf24 !important;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.4);
        }

        .vaga .placa {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.9;
            max-width: 75px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Controles */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
        }

        .botoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        .btn-estacionar {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .btn-estacionar:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-liberar {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .btn-liberar:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-liberar:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }

        .btn-buscar {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .mensagem {
            margin-top: 18px;
            padding: 12px 14px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 10px;
            font-size: 0.9rem;
            color: #93c5fd;
            min-height: 50px;
            display: flex;
            align-items: center;
        }

        /* Histórico */
        .historico {
            margin-top: 24px;
            max-height: 280px;
            overflow-y: auto;
        }

        .historico h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #94a3b8;
        }

        .log {
            background: rgba(15, 23, 42, 0.5);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border-left: 3px solid #3b82f6;
            animation: fadeIn 0.3s ease;
        }

        .log.entrada { border-left-color: #34d399; }
        .log.saida { border-left-color: #f87171; }

        .log .hora {
            color: #64748b;
            font-size: 0.75rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        .historico::-webkit-scrollbar {
            width: 6px;
        }
        .historico::-webkit-scrollbar-track {
            background: transparent;
        }
        .historico::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🅿️ Estacionamento Pro</h1>
            <p>Sistema inteligente de gerenciamento de vagas</p>
        </header>

        <!-- Estatísticas -->
        <div class="stats">
            <div class="stat-card total">
                <h3>Total de Vagas</h3>
                <div class="number" id="total">24</div>
            </div>
            <div class="stat-card livre">
                <h3>Vagas Livres</h3>
                <div class="number" id="livres">24</div>
            </div>
            <div class="stat-card ocupada">
                <h3>Ocupadas</h3>
                <div class="number" id="ocupadas">0</div>
            </div>
            <div class="stat-card receita">
                <h3>Receita Estimada</h3>
                <div class="number" id="receita">R$ 0</div>
            </div>
        </div>

        <div class="main">
            <!-- Mapa de Vagas -->
            <div class="card">
                <h2>🗺️ Mapa de Vagas</h2>
                <div class="grid" id="grid"></div>
            </div>

            <!-- Painel de Controle -->
            <div class="card">
                <h2>🎛️ Controles</h2>

                <div class="form-group">
                    <label>Placa do Veículo</label>
                    <input type="text" id="placa" placeholder="Ex: ABC1D23" maxlength="8">
                </div>

                <div class="form-group">
                    <label>Tipo de Veículo</label>
                    <select id="tipo">
                        <option value="carro">🚗 Carro</option>
                        <option value="moto">🏍️ Moto</option>
                        <option value="suv">🚙 SUV / Caminhonete</option>
                    </select>
                </div>

                <div class="botoes">
                    <button class="btn-estacionar" onclick="estacionar()">Estacionar Veículo</button>
                    <button class="btn-liberar" id="btnLiberar" onclick="liberar()" disabled>Liberar Vaga</button>
                    <button class="btn-buscar" onclick="buscarPlaca()">🔍 Buscar Placa</button>
                </div>

                <div class="mensagem" id="mensagem">
                    Selecione uma vaga ou digite a placa e clique em Estacionar
                </div>

                <div class="historico">
                    <h3>📋 Histórico Recente</h3>
                    <div id="logs"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_VAGAS = 24;
        const PRECO_HORA = 8; // R$ por hora

        let vagas = [];
        let vagaSelecionada = null;
        let historico = [];

        // Carrega dados salvos
        function carregarDados() {
            const dados = localStorage.getItem('estacionamento_pro');
            if (dados) {
                const parsed = JSON.parse(dados);
                vagas = parsed.vagas || [];
                historico = parsed.historico || [];
            }

            // Garante que todas as vagas existam
            if (vagas.length === 0) {
                for (let i = 1; i <= TOTAL_VAGAS; i++) {
                    vagas.push({
                        numero: i,
                        ocupada: false,
                        placa: null,
                        tipo: null,
                        entrada: null
                    });
                }
            }
        }

        // Salva no navegador
        function salvarDados() {
            localStorage.setItem('estacionamento_pro', JSON.stringify({
                vagas,
                historico
            }));
        }

        // Desenha a grade
        function desenhar() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            vagas.forEach(vaga => {
                const div = document.createElement('div');
                div.className = `vaga ${vaga.ocupada ? 'ocupada' : 'livre'}`;
                if (vagaSelecionada === vaga.numero) {
                    div.classList.add('selecionada');
                }

                div.innerHTML = `
                    <span>V${String(vaga.numero).padStart(2, '0')}</span>
                    ${vaga.ocupada ? `<span class="placa">${vaga.placa}</span>` : ''}
                `;

                div.onclick = () => selecionar(vaga.numero);
                grid.appendChild(div);
            });

            atualizarStats();
            renderHistorico();
        }

        // Seleciona vaga
        function selecionar(numero) {
            vagaSelecionada = numero;
            const vaga = vagas.find(v => v.numero === numero);
            const btn = document.getElementById('btnLiberar');
            const msg = document.getElementById('mensagem');

            if (vaga.ocupada) {
                btn.disabled = false;
                const tempo = calcularTempo(vaga.entrada);
                const valor = calcularValor(vaga.entrada);
                msg.innerHTML = `
                    <strong>V${String(numero).padStart(2,'0')}</strong> — ${vaga.placa} (${vaga.tipo})<br>
                    Tempo: ${tempo} | Valor: R$ ${valor.toFixed(2)}
                `;
            } else {
                btn.disabled = true;
                msg.innerHTML = `Vaga <strong>V${String(numero).padStart(2,'0')}</strong> selecionada. Digite a placa e clique em Estacionar.`;
            }

            desenhar();
        }

        // Estacionar
        function estacionar() {
            const placaInput = document.getElementById('placa');
            let placa = placaInput.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            const tipo = document.getElementById('tipo').value;

            if (placa.length < 7) {
                alert('Digite uma placa válida (ex: ABC1D23)');
                placaInput.focus();
                return;
            }

            // Já estacionado?
            const existe = vagas.find(v => v.ocupada && v.placa === placa);
            if (existe) {
                alert(`O veículo ${placa} já está na vaga V${String(existe.numero).padStart(2,'0')}!`);
                return;
            }

            let vaga;

            if (vagaSelecionada) {
                vaga = vagas.find(v => v.numero === vagaSelecionada);
                if (vaga.ocupada) {
                    alert('Esta vaga já está ocupada!');
                    return;
                }
            } else {
                vaga = vagas.find(v => !v.ocupada);
                if (!vaga) {
                    alert('Estacionamento lotado!');
                    return;
                }
            }

            vaga.ocupada = true;
            vaga.placa = placa;
            vaga.tipo = tipo;
            vaga.entrada = new Date().toISOString();

            placaInput.value = '';
            vagaSelecionada = null;
            document.getElementById('btnLiberar').disabled = true;

            adicionarLog('entrada', `🚗 ${placa} entrou na V${String(vaga.numero).padStart(2,'0')} (${tipo})`);
            document.getElementById('mensagem').innerHTML = `
                ✅ Veículo <strong>${placa}</strong> estacionado com sucesso na <strong>V${String(vaga.numero).padStart(2,'0')}</strong>!
            `;

            salvarDados();
            desenhar();
        }

        // Liberar
        function liberar() {
            if (!vagaSelecionada) return;

            const vaga = vagas.find(v => v.numero === vagaSelecionada);
            if (!vaga || !vaga.ocupada) return;

            const placa = vaga.placa;
            const tempo = calcularTempo(vaga.entrada);
            const valor = calcularValor(vaga.entrada);

            vaga.ocupada = false;
            vaga.placa = null;
            vaga.tipo = null;
            vaga.entrada = null;

            vagaSelecionada = null;
            document.getElementById('btnLiberar').disabled = true;

            adicionarLog('saida', `🚪 ${placa} saiu da V${String(vaga.numero).padStart(2,'0')} — ${tempo} — R$ ${valor.toFixed(2)}`);
            document.getElementById('mensagem').innerHTML = `
                ✅ Vaga liberada!<br>
                Veículo <strong>${placa}</strong> permaneceu <strong>${tempo}</strong><br>
                Valor estimado: <strong>R$ ${valor.toFixed(2)}</strong>
            `;

            salvarDados();
            desenhar();
        }

        // Buscar placa
        function buscarPlaca() {
            const placa = document.getElementById('placa').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (!placa) {
                alert('Digite a placa para buscar');
                return;
            }

            const vaga = vagas.find(v => v.ocupada && v.placa === placa);
            if (vaga) {
                selecionar(vaga.numero);
                document.getElementById('mensagem').innerHTML = `
                    🔍 Encontrado! <strong>${placa}</strong> está na vaga <strong>V${String(vaga.numero).padStart(2,'0')}</strong>
                `;
            } else {
                document.getElementById('mensagem').innerHTML = `❌ Placa <strong>${placa}</strong> não encontrada no estacionamento.`;
            }
        }

        // Cálculos
        function calcularTempo(entradaISO) {
            if (!entradaISO) return '0min';
            const entrada = new Date(entradaISO);
            const agora = new Date();
            const diff = Math.floor((agora - entrada) / 1000);

            if (diff < 60) return `${diff}s`;
            if (diff < 3600) return `${Math.floor(diff / 60)}min`;
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            return `${h}h ${m}min`;
        }

        function calcularValor(entradaISO) {
            if (!entradaISO) return 0;
            const entrada = new Date(entradaISO);
            const agora = new Date();
            const horas = (agora - entrada) / (1000 * 60 * 60);
            // Cobrança mínima de 1 hora
            return Math.max(1, Math.ceil(horas)) * PRECO_HORA;
        }

        // Stats
        function atualizarStats() {
            const ocupadas = vagas.filter(v => v.ocupada).length;
            document.getElementById('livres').textContent = TOTAL_VAGAS - ocupadas;
            document.getElementById('ocupadas').textContent = ocupadas;

            // Receita estimada (soma de todos os veículos atualmente estacionados)
            let receita = 0;
            vagas.forEach(v => {
                if (v.ocupada) receita += calcularValor(v.entrada);
            });
            document.getElementById('receita').textContent = `R$ ${receita.toFixed(0)}`;
        }

        // Histórico
        function adicionarLog(tipo, texto) {
            historico.unshift({
                tipo,
                texto,
                hora: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
            });
            if (historico.length > 20) historico.pop();
            salvarDados();
        }

        function renderHistorico() {
            const container = document.getElementById('logs');
            container.innerHTML = '';

            if (historico.length === 0) {
                container.innerHTML = '<div style="color:#64748b;font-size:0.85rem">Nenhuma operação ainda</div>';
                return;
            }

            historico.forEach(item => {
                const div = document.createElement('div');
                div.className = `log ${item.tipo}`;
                div.innerHTML = `
                    <div class="hora">${item.hora}</div>
                    ${item.texto}
                `;
                container.appendChild(div);
            });
        }

        // Inicialização
        carregarDados();
        desenhar();
    </script>
</body>
</html>

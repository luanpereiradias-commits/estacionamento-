<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Estacionamento</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 20px;
    margin: 0;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: #38bdf8;
    margin-bottom: 5px;
  }
  .subtitulo {
    text-align: center;
    color: #94a3b8;
    margin-bottom: 25px;
  }
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
  }
  .stat {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 14px;
    flex: 1;
    min-width: 100px;
    text-align: center;
  }
  .stat .label {
    font-size: 14px;
    color: #94a3b8;
  }
  .stat .valor {
    font-size: 24px;
    font-weight: bold;
    margin-top: 4px;
  }
  .verde { color: #4ade80; }
  .vermelho { color: #f87171; }
  .azul { color: #38bdf8; }

  .vagas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
    gap: 10px;
    margin-bottom: 30px;
  }
  .vaga {
    height: 75px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border: 2px solid;
  }
  .vaga.livre {
    background: #14532d;
    border-color: #22c55e;
    color: #4ade80;
  }
  .vaga.ocupada {
    background: #7f1d1d;
    border-color: #ef4444;
    color: #fca5a5;
    font-size: 13px;
    text-align: center;
    padding: 6px;
  }

  .painel {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .painel h2 {
    color: #38bdf8;
    font-size: 18px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
    color: #94a3b8;
  }
  input, select {
    width: 100%;
    padding: 11px;
    margin-bottom: 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-entrar {
    background: #22c55e;
    color: #052e16;
  }
  .btn-sair {
    background: #ef4444;
    color: white;
  }
  .historico {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 15px;
    max-height: 220px;
    overflow-y: auto;
  }
  .historico h2 {
    color: #38bdf8;
    font-size: 18px;
    margin-bottom: 10px;
  }
  .hist-item {
    padding: 8px 0;
    border-bottom: 1px solid #334155;
    font-size: 14px;
  }
  .hist-hora {
    color: #64748b;
    font-size: 12px;
  }
  .mensagem {
    text-align: center;
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    background: #0f172a;
    color: #38bdf8;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Sistema de Estacionamento</h1>
    <p class="subtitulo">Controle de vagas</p>

    <div class="stats">
      <div class="stat">
        <div class="label">Total</div>
        <div class="valor azul" id="total">12</div>
      </div>
      <div class="stat">
        <div class="label">Livres</div>
        <div class="valor verde" id="livres">12</div>
      </div>
      <div class="stat">
        <div class="label">Ocupadas</div>
        <div class="valor vermelho" id="ocupadas">0</div>
      </div>
    </div>

    <div class="vagas-grid" id="vagas"></div>

    <div class="painel">
      <h2>Entrada de Veículo</h2>
      <label>Placa</label>
      <input type="text" id="placa" placeholder="Ex: ABC1D23" maxlength="8">
      <label>Escolher Vaga Livre</label>
      <select id="vagaEntrada"></select>
      <button class="btn-entrar" onclick="entrar()">Registrar Entrada</button>
    </div>

    <div class="painel">
      <h2>Saída de Veículo</h2>
      <label>Escolher Vaga Ocupada</label>
      <select id="vagaSaida"></select>
      <button class="btn-sair" onclick="sair()">Registrar Saída</button>
    </div>

    <div class="historico">
      <h2>Histórico</h2>
      <div id="listaHistorico"></div>
    </div>

    <div class="mensagem" id="mensagem"></div>
  </div>

<script>
  const TOTAL_VAGAS = 12;
  let vagas = [];

  for (let i = 1; i <= TOTAL_VAGAS; i++) {
    vagas.push({
      numero: i,
      ocupada: false,
      placa: null
    });
  }

  function atualizarTela() {
    const container = document.getElementById("vagas");
    container.innerHTML = "";

    vagas.forEach(function(vaga) {
      const div = document.createElement("div");
      div.className = "vaga " + (vaga.ocupada ? "ocupada" : "livre");

      if (vaga.ocupada) {
        div.innerHTML = "Vaga " + vaga.numero + "<br>" + vaga.placa;
      } else {
        div.textContent = "Vaga " + vaga.numero;
      }
      container.appendChild(div);
    });

    const selEntrada = document.getElementById("vagaEntrada");
    const selSaida = document.getElementById("vagaSaida");

    selEntrada.innerHTML = "<option value=''>Selecione...</option>";
    selSaida.innerHTML = "<option value=''>Selecione...</option>";

    vagas.forEach(function(vaga) {
      if (!vaga.ocupada) {
        selEntrada.innerHTML += "<option value='" + vaga.numero + "'>Vaga " + vaga.numero + "</option>";
      } else {
        selSaida.innerHTML += "<option value='" + vaga.numero + "'>Vaga " + vaga.numero + " - " + vaga.placa + "</option>";
      }
    });

    const livres = vagas.filter(function(v) { return !v.ocupada; }).length;
    document.getElementById("total").textContent = TOTAL_VAGAS;
    document.getElementById("livres").textContent = livres;
    document.getElementById("ocupadas").textContent = TOTAL_VAGAS - livres;
  }

  function entrar() {
    const placa = document.getElementById("placa").value.trim().toUpperCase();
    const num = parseInt(document.getElementById("vagaEntrada").value);

    if (!placa) {
      alert("Digite a placa do veículo!");
      return;
    }
    if (!num) {
      alert("Selecione uma vaga!");
      return;
    }

    for (let i = 0; i < vagas.length; i++) {
      if (vagas[i].ocupada && vagas[i].placa === placa) {
        alert("Esta placa já está estacionada!");
        return;
      }
    }

    const vaga = vagas.find(function(v) { return v.numero === num; });
    if (vaga.ocupada) {
      alert("Esta vaga já está ocupada!");
      return;
    }

    vaga.ocupada = true;
    vaga.placa = placa;

    document.getElementById("placa").value = "";
    document.getElementById("mensagem").textContent = "Veículo " + placa + " estacionado na Vaga " + num;

    adicionarHistorico("ENTRADA → " + placa + " na Vaga " + num);
    atualizarTela();
  }

  function sair() {
    const num = parseInt(document.getElementById("vagaSaida").value);

    if (!num) {
      alert("Selecione uma vaga ocupada!");
      return;
    }

    const vaga = vagas.find(function(v) { return v.numero === num; });
    if (!vaga || !vaga.ocupada) {
      alert("Esta vaga já está livre!");
      return;
    }

    const placa = vaga.placa;
    vaga.ocupada = false;
    vaga.placa = null;

    document.getElementById("mensagem").textContent = "Veículo " + placa + " saiu da Vaga " + num;
    adicionarHistorico("SAÍDA → " + placa + " da Vaga " + num);
    atualizarTela();
  }

  function adicionarHistorico(texto) {
    const agora = new Date();
    const hora = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

    const div = document.createElement("div");
    div.className = "hist-item";
    div.innerHTML = texto + "<div class='hist-hora'>" + hora + "</div>";

    const lista = document.getElementById("listaHistorico");
    lista.insertBefore(div, lista.firstChild);
  }

  atualizarTela();
</script>
</body>
</html>

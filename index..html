<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Estacionamento</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    padding: 20px;
  }
  h1 { color: #00d4ff; }
  .vaga {
    display: inline-block;
    width: 80px;
    height: 60px;
    margin: 5px;
    text-align: center;
    line-height: 60px;
    border-radius: 8px;
    font-weight: bold;
  }
  .livre { background: #0a5; }
  .ocupada { background: #a00; font-size: 12px; line-height: 1.3; padding-top: 12px; }
  input, select, button {
    padding: 10px;
    margin: 5px 0;
    font-size: 16px;
  }
  button { cursor: pointer; }
</style>
</head>
<body>

<h1>Sistema de Estacionamento</h1>

<div id="vagas"></div>

<br><br>

<b>Entrada:</b><br>
Placa: <input type="text" id="placa" placeholder="ABC1234"><br>
Vaga: <select id="entrada"></select><br>
<button onclick="entrar()">Entrar</button>

<br><br>

<b>Saída:</b><br>
<select id="saida"></select><br>
<button onclick="sair()">Sair</button>

<br><br>
<div id="msg"></div>

<script>
  let vagas = [];

  // cria 10 vagas
  for(let i=1; i<=10; i++){
    vagas.push({num: i, livre: true, placa: ""});
  }

  function mostrar(){
    let html = "";
    let optsEntrada = "<option value=''>Escolha</option>";
    let optsSaida = "<option value=''>Escolha</option>";

    for(let v of vagas){
      if(v.livre){
        html += `<div class="vaga livre">Vaga ${v.num}</div>`;
        optsEntrada += `<option value="${v.num}">Vaga ${v.num}</option>`;
      } else {
        html += `<div class="vaga ocupada">V${v.num}<br>${v.placa}</div>`;
        optsSaida += `<option value="${v.num}">Vaga ${v.num} - ${v.placa}</option>`;
      }
    }

    document.getElementById("vagas").innerHTML = html;
    document.getElementById("entrada").innerHTML = optsEntrada;
    document.getElementById("saida").innerHTML = optsSaida;
  }

  function entrar(){
    let placa = document.getElementById("placa").value.toUpperCase().trim();
    let num = document.getElementById("entrada").value;

    if(!placa){ alert("Digite a placa"); return; }
    if(!num){ alert("Escolha a vaga"); return; }

    let v = vagas.find(x => x.num == num);
    v.livre = false;
    v.placa = placa;

    document.getElementById("placa").value = "";
    document.getElementById("msg").innerHTML = "Veículo " + placa + " entrou na vaga " + num;
    mostrar();
  }

  function sair(){
    let num = document.getElementById("saida").value;
    if(!num){ alert("Escolha a vaga"); return; }

    let v = vagas.find(x => x.num == num);
    document.getElementById("msg").innerHTML = "Veículo " + v.placa + " saiu da vaga " + num;
    v.livre = true;
    v.placa = "";
    mostrar();
  }

  mostrar();
</script>

</body>
</html>

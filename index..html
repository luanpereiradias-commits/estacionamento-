<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Estacionamento Simples</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    h1 { color: #00d4ff; text-align: center; }
    .stats {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }
    .stat {
      background: #16213e;
      padding: 15px 25px;
      border-radius: 8px;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }
    .stat span { display: block; font-size: 24px; font-weight: bold; margin-top: 5px; }
    .verde { color: #00ff88; }
    .vermelho { color: #ff5555; }
    .azul { color: #00d4ff; }

    .vagas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }
    .vaga {
      height: 70px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      border: 2px solid;
    }
    .livre {
      background: #0a3d2a;
      border-color: #00ff88;
      color: #00ff88;
    }
    .ocupada {
      background: #3d0a0a;
      border-color: #ff5555;
      color: #ffaaaa;
      font-size: 12px;
    }

    .painel {
      background: #16213e;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    input, select, button {
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }
    input, select { background: #0f3460; color: white; }
    button {
      background: #00d4ff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button.sair { background: #ff5555; color: white; }
    .historico {
      background: #16213e;
      padding: 15px;
      border-radius: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 14px;
    }
    .historico div { padding: 5px 0; border-bottom: 1px solid #333; }
  </style>
</head>
<body>

  <h1>🅿️ Estacionamento</h1>

  <div class="stats">
    <div class="stat">Total<br><span class="azul" id="total">12</span></div>
    <div class="stat">Livres<br><span class="verde" id="livres">12</span></div>
    <div class="stat">Ocupadas<br><span class="vermelho" id="ocupadas">0</span></div>
  </div>

  <div class="vagas" id="vagas"></div>

  <div class="painel">
    <h3>Entrada</h3>
    <input type="text" id="placa" placeholder="Placa (ex: ABC1D23)" maxlength="8">
    <select id="vagaEntrada"></select>
    <button onclick="entrar()">Registrar Entrada</button>
  </div>

  <div class="painel">
    <h3>Saída</h3>
    <select id="vagaSaida"></select>
    <button class="sair" onclick="sair()">Registrar Saída</button>
  </div>

  <h3>Histórico</h3>
  <div class="historico" id="historico"></div>

  <script>
    const TOTAL = 12;
    let vagas = [];

    // Criar vagas
    for (let i = 1; i <= TOTAL; i++) {
      vagas.push({ num: i, ocupada: false, placa: null });
    }

    function atualizar() {
      // Grade de vagas
      const container = document.getElementById('vagas');
      container.innerHTML = '';
      vagas.forEach(v => {
        const div = document.createElement('div');
        div.className = 'vaga ' + (v.ocupada ? 'ocupada' : 'livre');
        div.innerHTML = v.ocupada ? `V${v.num}<br>${v.placa}` : `Vaga ${v.num}`;
        container.appendChild(div);
      });

      // Selects
      const selEnt = document.getElementById('vagaEntrada');
      const selSai = document.getElementById('vagaSaida');
      selEnt.innerHTML = '<option value="">Escolha vaga livre</option>';
      selSai.innerHTML = '<option value="">Escolha vaga ocupada</option>';

      vagas.forEach(v => {
        if (!v.ocupada) {
          selEnt.innerHTML += `<option value="${v.num}">Vaga ${v.num}</option>`;
        } else {
          selSai.innerHTML += `<option value="${v.num}">Vaga ${v.num} - ${v.placa}</option>`;
        }
      });

      // Stats
      const livres = vagas.filter(v => !v.ocupada).length;
      document.getElementById('total').textContent = TOTAL;
      document.getElementById('livres').textContent = livres;
      document.getElementById('ocupadas').textContent = TOTAL - livres;
    }

    function entrar() {
      const placa = document.getElementById('placa').value.trim().toUpperCase();
      const num = parseInt(document.getElementById('vagaEntrada').value);

      if (!placa) { alert('Digite a placa!'); return; }
      if (!num) { alert('Escolha uma vaga!'); return; }

      const vaga = vagas.find(v => v.num === num);
      if (vaga.ocupada) { alert('Vaga já ocupada!'); return; }

      vaga.ocupada = true;
      vaga.placa = placa;
      document.getElementById('placa').value = '';

      adicionarHist(`ENTRADA → ${placa} na Vaga ${num}`);
      atualizar();
    }

    function sair() {
      const num = parseInt(document.getElementById('vagaSaida').value);
      if (!num) { alert('Escolha uma vaga ocupada!'); return; }

      const vaga = vagas.find(v => v.num === num);
      if (!vaga.ocupada) { alert('Vaga já está livre!'); return; }

      adicionarHist(`SAÍDA → ${vaga.placa} da Vaga ${num}`);
      vaga.ocupada = false;
      vaga.placa = null;
      atualizar();
    }

    function adicionarHist(texto) {
      const agora = new Date().toLocaleTimeString('pt-BR');
      const div = document.createElement('div');
      div.textContent = `[${agora}] ${texto}`;
      document.getElementById('historico').prepend(div);
    }

    // Iniciar
    atualizar();
  </script>
</body>
</html>
